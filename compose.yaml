services:
  intraready:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraready:0.1.0
    container_name: intraready
    restart: unless-stopped
    environment:
      INTRASTAT_DATA_DIR: /data
      INTRASTAT_APP_TITLE: IntraReady
      INTRASTAT_APP_PASSWORD: ${INTRASTAT_APP_PASSWORD:-}
      INTRASTAT_MAX_UPLOAD_MB: 20
    ports:
      - "${INTRASTAT_PORT:-8088}:8000"
    volumes:
      - intraready_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  intraready_data:
