services:
  intraready:
    build: .
    image: intraready:0.6.0
    container_name: intraready
    restart: unless-stopped
    environment:
      INTRASTAT_DATA_DIR: /data
      INTRASTAT_APP_TITLE: IntraReady
      INTRASTAT_APP_PASSWORD: ${INTRASTAT_APP_PASSWORD:-}
      INTRASTAT_MAX_UPLOAD_MB: 20
      INTRASTAT_OLLAMA_URL: http://ollama:11434
      INTRASTAT_OLLAMA_MODEL: ${INTRASTAT_OLLAMA_MODEL:-qwen2.5vl:3b}
    depends_on:
      - ollama
    ports:
      - "${INTRASTAT_PORT:-8088}:8000"
    volumes:
      - intraready_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,noexec,nosuid

  ollama:
    image: ollama/ollama:latest
    container_name: intraready-ollama
    restart: unless-stopped
    gpus: all
    volumes:
      - intraready_ai:/root/.ollama

  ollama-setup:
    image: ollama/ollama:latest
    container_name: intraready-ai-setup
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${INTRASTAT_OLLAMA_MODEL:-qwen2.5vl:3b}"]

volumes:
  intraready_data:
  intraready_ai:
