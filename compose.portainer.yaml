services:
  intraready:
    build: .
    image: intraready:0.7.0
    container_name: intraready
    restart: unless-stopped
    environment:
      INTRASTAT_DATA_DIR: /data
      INTRASTAT_APP_TITLE: IntraReady
      INTRASTAT_APP_PASSWORD: ${INTRASTAT_APP_PASSWORD:-}
      INTRASTAT_MAX_UPLOAD_MB: 20
      INTRASTAT_OPENAI_API_KEY: ${INTRASTAT_OPENAI_API_KEY:-}
      INTRASTAT_OPENAI_MODEL: ${INTRASTAT_OPENAI_MODEL:-gpt-5.6-terra}
    ports:
      - "${INTRASTAT_PORT:-8088}:8000"
    volumes:
      - intraready_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,noexec,nosuid

volumes:
  intraready_data:
    name: ${INTRASTAT_DATA_VOLUME:-intraready_intraready_data}
